replicaCount: 1

image:
  repository: docker.io/sathvikm2002/secretusage
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

watchNamespace: ""

leaderElection:
  enabled: true

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

metrics:
  enabled: true
  service:
    type: ClusterIP
    port: 8080
    annotations: {}

healthProbe:
  port: 8081
