{{- if .Values.rbac.create -}}
{{- if .Values.watchNamespace }}
# Scoping the controller to one namespace scopes its permissions to that namespace
# too. A namespaced install can never read a Secret outside .Values.watchNamespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "secretusage-controller.fullname" . }}
  namespace: {{ .Values.watchNamespace }}
  labels:
    {{- include "secretusage-controller.labels" . | nindent 4 }}
rules:
  {{- include "secretusage-controller.rules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "secretusage-controller.fullname" . }}
  namespace: {{ .Values.watchNamespace }}
  labels:
    {{- include "secretusage-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "secretusage-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "secretusage-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "secretusage-controller.fullname" . }}
  labels:
    {{- include "secretusage-controller.labels" . | nindent 4 }}
rules:
  {{- include "secretusage-controller.rules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "secretusage-controller.fullname" . }}
  labels:
    {{- include "secretusage-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "secretusage-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "secretusage-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.leaderElection.enabled }}
---
# Leader election leases live in the release namespace only, so they never need
# cluster-wide lease permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "secretusage-controller.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secretusage-controller.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Leader election records a LeaderElection event when a replica takes the lease.
  # Without this the election still works, but every handover logs an error.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "secretusage-controller.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secretusage-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "secretusage-controller.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "secretusage-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
