{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "secretusage-controller.fullname" . }}
  labels:
    {{- include "secretusage-controller.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - usage.secretusage.io
    resources:
      - secretusages
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - usage.secretusage.io
    resources:
      - secretusages/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - pods
      - replicationcontrollers
      - secrets
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "secretusage-controller.fullname" . }}
  labels:
    {{- include "secretusage-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "secretusage-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "secretusage-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
